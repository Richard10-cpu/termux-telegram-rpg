name: Sync Fork

on:
  repository_dispatch:
    types: [upstream-push]
  schedule:
    # Fallback: каждый день в 6:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Ручной запуск при необходимости

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync with upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Richard10-cpu/termux-telegram-rpg.git
          git fetch upstream
          git merge upstream/main --no-edit || true
          git push origin main

      - name: Log trigger info
        if: github.event_name == 'repository_dispatch'
        run: |
          echo "Triggered by upstream commit: ${{ github.event.client_payload.commit }}"
          echo "Message: ${{ github.event.client_payload.message }}"
